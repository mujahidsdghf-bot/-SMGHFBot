name: Daily Crypto Bot Alert

on:
  schedule:
    - cron: '30 3 * * *'  # ప్రతిరోజూ ఉదయం IST 9:00 AM కి రన్ అవుతుంది
  workflow_dispatch:      # మీరు బటన్ నొక్కినప్పుడు కూడా రన్ అవుతుంది

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas numpy upstox-python-sdk

      - name: Run Market Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python main.py
          
