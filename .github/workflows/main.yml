name: Hourly Crypto and Market Bot Alert

on:
  schedule:
    - cron: '0 * * * *'   # ప్రతి 1 గంటకు ఆటోమేటిక్‌గా రన్ అవుతుంది
  workflow_dispatch:       # మీరు మాన్యువల్‌గా Run workflow నొక్కినప్పుడు కూడా పనిచేస్తుంది

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas numpy upstox-python-sdk

      - name: Run Market Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python main.py
